<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>置頂內容｜SpotMoCity 澳聚光</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: #1f2937; background: #f8fafc; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
        html.embedded, html.embedded body { min-height: 100%; }
        html.embedded .site-header, html.embedded [data-embedded-back] { display: none; }
        html.embedded main { padding: 0.75rem; }
        .site-header { background: rgb(255 255 255 / 95%); box-shadow: 0 1px 4px #0f172a1a; }
        .site-header-inner { max-width: 72rem; margin: 0 auto; padding: 0.5rem 1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
        .site-logo { width: 100px; height: 60px; object-fit: contain; }
        .site-nav { display: flex; gap: 0.75rem; font-size: 0.875rem; }
        main { max-width: 1100px; margin: 0 auto; padding: 1rem 1rem 3rem; }
        #hero-detail, #hero-detail > *, #hero-detail header, #hero-detail section,
        #hero-detail article, #hero-detail [role="tabpanel"] { min-width: 0; overflow-wrap: anywhere; }
        #hero-detail h1, #hero-detail h2, #hero-detail h3, #hero-detail p,
        #hero-detail a, #hero-detail .rich-content { overflow-wrap: anywhere; }
        .hero-media { overflow: hidden; min-height: 8rem; max-height: 22rem; background: #e2e8f0; border-radius: 1.25rem; }
        .hero-media img, .hero-media video, .hero-media iframe { width: 100%; height: clamp(8rem, 30vw, 22rem); display: block; object-fit: cover; border: 0; }
        .hero-media iframe { height: clamp(8rem, 30vw, 22rem); }
        #hero-detail img { cursor: zoom-in; }
        #hero-detail img:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
        #image-lightbox { width: min(96vw, 80rem); max-width: none; max-height: 94dvh; padding: 0; border: 0; border-radius: 1rem; overflow: hidden; background: transparent; }
        #image-lightbox::backdrop { background: rgb(15 23 42 / 82%); }
        #image-lightbox-content { position: relative; display: grid; place-items: center; min-height: 8rem; }
        #image-lightbox img { display: block; max-width: 100%; max-height: 94dvh; object-fit: contain; cursor: zoom-out; }
        #close-image-lightbox { position: absolute; z-index: 1; top: 0.75rem; right: 0.75rem; display: grid; width: 2.5rem; height: 2.5rem; place-items: center; border: 0; border-radius: 9999px; color: #fff; background: rgb(15 23 42 / 75%); font-size: 1.5rem; cursor: pointer; }
        .countdown span { display: inline-flex; min-width: 4.25rem; flex-direction: column; border-radius: 0.75rem; background: #fff; padding: 0.75rem; text-align: center; box-shadow: 0 1px 5px #0f172a18; }
        .tab-button[aria-selected="true"] { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; }
        .rich-content h2 { margin: 1rem 0 0.5rem; font-size: 1.35rem; font-weight: 700; }
        .rich-content h3 { margin: 0.85rem 0 0.4rem; font-size: 1.1rem; font-weight: 700; }
        .rich-content ul, .rich-content ol { margin: 0.75rem 0; padding-left: 1.5rem; }
        .rich-content ul { list-style: disc; }
        .rich-content ol { list-style: decimal; }
        .rich-content a { color: #1d4ed8; text-decoration: underline; }
        .rich-content blockquote { margin: 0.75rem 0; border-left: 3px solid #93c5fd; padding-left: 0.75rem; color: #475569; }
        .rich-content img { display: block; margin: 0.75rem 0; max-width: 100%; height: auto; border-radius: 0.75rem; }
        .rich-content .rich-table { width: 100%; margin: 0.75rem 0; border: 1px solid #cbd5e1; border-collapse: separate; border-spacing: 0; border-radius: 0.75rem; overflow: hidden; table-layout: fixed; }
        .rich-content .rich-table-cell { min-width: 4rem; height: 3rem; border: 0; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; padding: 0.5rem; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
        .rich-content .rich-table tr > :last-child { border-right: 0; }
        .rich-content .rich-table tr:last-child > .rich-table-cell { border-bottom: 0; }
        .rich-content th.rich-table-cell { background: #f1f5f9; font-weight: 700; }
        #hero-detail[data-theme="warm"] > header, #hero-detail[data-theme="warm"] > section:not(#team-section) { background-color: #fffbeb; }
        #hero-detail[data-theme="blue"] > header, #hero-detail[data-theme="blue"] > section:not(#team-section) { background-color: #eff6ff; }
        #hero-detail[data-theme="green"] > header, #hero-detail[data-theme="green"] > section:not(#team-section) { background-color: #ecfdf5; }
        #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) > header, #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) > section { background-color: #172033; color: #f8fafc; border-color: #334155; }
        #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) h1, #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) h2, #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) h3, #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) p { color: #f8fafc; }
        #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) #highlight-grid article, #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) #team-grid article, #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) #countdown-wrap { background-color: #273449; border-color: #475569; }
        #hero-detail[data-theme="dark"]:not([data-smart-page="true"]) .countdown span { background-color: #fff; color: #172033; }
        #hero-detail[data-order="details-first"] #details-section { order: 2; }
        #hero-detail[data-order="details-first"] #highlight-grid { order: 3; }
        #hero-detail[data-order="details-first"] #team-section { order: 4; }
        #hero-detail[data-order="people-first"] #team-section { order: 2; }
        #hero-detail[data-order="people-first"] #highlight-grid { order: 3; }
        #hero-detail[data-order="people-first"] #details-section { order: 4; }
        #hero-detail[data-order="details-first"], #hero-detail[data-order="people-first"] { display: flex; flex-direction: column; }

        #hero-detail[data-order="details-first"] > header, #hero-detail[data-order="people-first"] > header { order: 1; }

        #hero-detail[data-order="details-first"] .smart-hero, #hero-detail[data-order="people-first"] .smart-hero { order: 0; }
        #hero-detail[data-smart-layout="true"] { display: flex; flex-direction: column; }
        #hero-detail[data-smart-layout="true"] > * { margin-top: 0; }
        #hero-detail[data-smart-layout="true"] #hero-title, #hero-detail[data-smart-layout="true"] #hero-subtitle,
        #hero-detail[data-smart-layout="true"] #hero-kicker { color: inherit; }
        #hero-detail[data-theme="dark"][data-smart-layout="true"] #hero-title,
        #hero-detail[data-theme="dark"][data-smart-layout="true"] #hero-subtitle,
        #hero-detail[data-theme="dark"][data-smart-layout="true"] #hero-kicker { color: inherit; }
        #hero-detail[data-smart-page="true"] [data-smart-section] { color: var(--section-text); }
        #hero-detail[data-smart-page="true"] [data-smart-section="highlights"] { background: transparent; }
        #hero-detail[data-smart-page="true"] [data-smart-section]:not([data-smart-section="highlights"]),
        #hero-detail[data-smart-page="true"] [data-smart-section] article,
        #hero-detail[data-smart-page="true"] #contact-methods > div {
            background: var(--section-bg); border: 1px solid var(--section-border);
            border-radius: var(--section-radius); box-shadow: var(--section-shadow);
        }
        #hero-detail[data-smart-page="true"] #team-section { padding: 1.25rem; }
        #hero-detail[data-smart-page="true"] [data-smart-section] h2,
        #hero-detail[data-smart-page="true"] [data-smart-section] h3,
        #hero-detail[data-smart-page="true"] [data-smart-section] p,
        #hero-detail[data-smart-page="true"] [data-smart-section] [role="tabpanel"] { color: var(--section-text); }
        #hero-detail[data-smart-page="true"] [data-smart-section] a { color: var(--section-link); }
        #hero-detail[data-smart-page="true"] .tab-button { color: var(--section-text); border-color: var(--section-border); }
        #hero-detail[data-smart-page="true"] .tab-button[aria-selected="true"] { color: var(--section-bg); background: var(--section-text); }
        #hero-detail[data-smart-page="true"] .rich-table-cell { border-color: var(--section-border); }
        #hero-detail[data-smart-page="true"] th.rich-table-cell { background: transparent; }
        @media (min-width: 768px) {
            #hero-detail[data-smart-page="true"] #highlight-grid,
            #hero-detail[data-smart-page="true"] #team-grid,
            #hero-detail[data-smart-page="true"] #contact-methods { grid-template-columns: repeat(var(--section-columns), minmax(0, 1fr)); }
        }
        @media (min-width: 768px) {
            .smart-hero { display: var(--smart-display); flex-direction: var(--smart-direction); grid-template-columns: var(--smart-columns); }
        }
        @media (min-width: 768px) {
            #hero-detail[data-layout="split"]:not([data-smart-layout="true"]) { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.5rem; }
            #hero-detail[data-layout="split"]:not([data-smart-layout="true"]) > * { grid-column: 1 / -1; margin-top: 0; }
            #hero-detail[data-layout="split"]:not([data-smart-layout="true"]) .hero-media { grid-column: 1; }
            #hero-detail[data-layout="split"]:not([data-smart-layout="true"]) > header { grid-column: 2; }
        }
        @media (max-width: 640px) {
            .site-header-inner { padding: 0.4rem 0.75rem; }
            main { padding: 0.75rem 0.75rem 2rem; }
            .hero-media { min-height: 7rem; max-height: 12rem; border-radius: 0.9rem; }
            .hero-media img, .hero-media video, .hero-media iframe { height: clamp(7rem, 42vw, 12rem); }
            #hero-detail { gap: 1rem; }
            #hero-detail > header { padding: 1.1rem; border-radius: 1rem; }
            #hero-detail > header h1 { font-size: 1.65rem; }
            #hero-detail > header > p:nth-of-type(2) { margin-top: 0.6rem; font-size: 1rem; line-height: 1.6; }
            #highlight-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.5rem; }
            #highlight-grid article { padding: 0.75rem; }
            #detail-panels { overflow-wrap: anywhere; }
            #team-grid { grid-template-columns: minmax(0, 1fr); }
            .countdown span { min-width: 3.5rem; padding: 0.55rem; }
            html.embedded main { padding: 0.5rem; }
            html.embedded #hero-detail { gap: 0.75rem; }
            html.embedded .hero-media { max-height: 10rem; }
            html.embedded .hero-media img, html.embedded .hero-media video, html.embedded .hero-media iframe { height: clamp(6rem, 34vw, 10rem); }
        }
        @media (max-width: 380px) {
            #highlight-grid { grid-template-columns: minmax(0, 1fr); }
            .site-logo { width: 72px; height: 44px; }
            .site-nav { gap: 0.5rem; font-size: 0.75rem; }
        }
    </style>
</head>

    <dialog id="image-lightbox" aria-label="圖片放大檢視">
        <div id="image-lightbox-content">
            <button id="close-image-lightbox" type="button" aria-label="關閉圖片">×</button>
            <img id="image-lightbox-image" alt="">
        </div>
    </dialog>
    <script src="smart-layout.js?v=20261029-page"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseClient = window.supabase.createClient(
            'https://owvsfvunlqudrhdsuqvk.supabase.co',
            'sb_publishable_4kBnCjtv4c7j-sb8l3BrUw_j63egBDR'
        );
        const isEmbedded = new URLSearchParams(location.search).get('embed') === '1';
        const isPreview = new URLSearchParams(location.search).get('preview') === '1';
        let currentFeaturedPageId = '';
        const imageLightbox = document.getElementById('image-lightbox');
        const lightboxImage = document.getElementById('image-lightbox-image');

        function closeImageLightbox() {
            if (imageLightbox.open) imageLightbox.close();
            lightboxImage.removeAttribute('src');
            lightboxImage.alt = '';
        }

        function openImageLightbox(image) {
            lightboxImage.src = image.currentSrc || image.src;
            lightboxImage.alt = image.alt || '置頂內容圖片';
            imageLightbox.showModal();
        }

        const heroDetail = document.getElementById('hero-detail');
        heroDetail.addEventListener('click', event => {
            const image = event.target instanceof Element ? event.target.closest('img') : null;
            if (!image || !heroDetail.contains(image)) return;
            openImageLightbox(image);
        });
        heroDetail.addEventListener('keydown', event => {
            const image = event.target instanceof Element ? event.target.closest('img') : null;
            if (!image || !heroDetail.contains(image) || !['Enter', ' '].includes(event.key)) return;
            event.preventDefault();
            openImageLightbox(image);
        });
        document.getElementById('close-image-lightbox').addEventListener('click', closeImageLightbox);
        imageLightbox.addEventListener('click', event => {
            if (event.target === imageLightbox) closeImageLightbox();
        });
        imageLightbox.addEventListener('close', () => {
            lightboxImage.removeAttribute('src');
            lightboxImage.alt = '';
        });

        async function trackFeaturedActivityEvent(pageId, eventType) {
            try {
                const { error } = await supabaseClient.rpc('track_featured_activity_event', {
                    p_page_id: pageId,
                    p_event_type: eventType
                });
                if (error) console.warn('Featured activity analytics unavailable:', error.message);
            } catch (error) {
                console.warn('Featured activity analytics unavailable:', error?.message || error);
            }
        }

        if (isEmbedded) {
            document.documentElement.classList.add('embedded');
            window.addEventListener('keydown', event => {
                if (event.key !== 'Escape') return;
                if (imageLightbox.open) return;
                event.preventDefault();
                window.parent.postMessage({ type: 'close-featured-detail' }, location.origin);
            });
        }

        function safeHttpsUrl(value) {
            try {
                const url = new URL(String(value || ''), window.location.href);
                return url.protocol === 'https:' ? url.href : '';
            } catch {
                return '';
            }
        }

        function parseArray(value) {
            try {
                const parsed = JSON.parse(value || '[]');
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }

            function readableTextColor(foreground, background) {
                const luminance = color => {
                    const hex = color.slice(1);
                    const expanded = hex.length === 3 ? [...hex].map(char => char + char).join('') : hex;
                    const channels = [0, 2, 4].map(index => parseInt(expanded.slice(index, index + 2), 16) / 255)
                        .map(value => value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4);
                    return channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
                };
                const bg = luminance(background);
                const contrast = color => {
                    const fg = luminance(color);
                    return (Math.max(fg, bg) + 0.05) / (Math.min(fg, bg) + 0.05);
                };
                return contrast(foreground) >= 4.5 ? foreground : contrast('#000000') >= contrast('#ffffff') ? '#000000' : '#ffffff';
            }
        }

        function renderHeroMedia(item) {
            const container = document.getElementById('hero-media');
            const mediaType = item.heroMediaType || 'image';
            const mediaUrl = safeHttpsUrl(item.heroMediaUrl);
            if (mediaType === 'youtube' && mediaUrl) {
                const url = new URL(mediaUrl);
                let videoId = '';
                if (url.hostname === 'youtu.be') videoId = url.pathname.slice(1);
                if (url.hostname === 'youtube.com' || url.hostname.endsWith('.youtube.com')) {
                    if (url.pathname === '/watch') videoId = url.searchParams.get('v') || '';
                    else if (url.pathname.startsWith('/embed/')) videoId = url.pathname.split('/')[2] || '';
                }
                if (/^[\w-]{11}$/.test(videoId)) {
                    container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(videoId)}" title="活動影片" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;
                    return;
                }
            }
            if (mediaType === 'mp4' && mediaUrl) {
                const video = document.createElement('video');
                video.src = mediaUrl;
                video.controls = true;
                video.playsInline = true;
                video.preload = 'metadata';
                container.replaceChildren(video);
                return;
            }
            const imageUrl = safeHttpsUrl(item.imageUrl);
            if (!imageUrl) {
                container.classList.add('hidden');
                return;
            }
            const picture = document.createElement('picture');
            const mobile = safeHttpsUrl(item.mobileImageUrl);
            if (mobile) {
                const source = document.createElement('source');
                source.media = '(max-width: 767px)';
                source.srcset = mobile;
                picture.append(source);
            }
            const image = document.createElement('img');
            image.src = imageUrl;
            image.alt = item.headline || item.title || '活動主視覺';
            image.fetchPriority = 'high';
            picture.append(image);
            container.replaceChildren(picture);
        }

        function renderHighlights(highlights) {
            const grid = document.getElementById('highlight-grid');
            const entries = [
                ['💰 價錢', highlights.ticket],
                ['👥 適合對象', highlights.audience],
                ['📍 活動地點／交通', highlights.venue]
            ].filter(([, value]) => typeof value === 'string' && value.trim());
            grid.innerHTML = entries.map(([label, value]) => {
                const card = document.createElement('article');
                card.className = 'rounded-xl border border-gray-200 bg-white p-4 shadow-sm';
                const title = document.createElement('h2');
                title.className = 'text-sm font-semibold text-gray-500';
                title.textContent = label;
                const detail = document.createElement('p');
                detail.className = 'mt-2 whitespace-pre-line font-medium text-gray-800';
                detail.textContent = value;
                card.append(title, detail);
                return card.outerHTML;
            }).join('');
        }

        function renderTabs(tabs) {
            const data = [
                ['highlights', '活動／品牌亮點', tabs.highlights],
                ['schedule', '詳細內容', tabs.schedule],
                ['faq', '常見問題 FAQ', tabs.faq]
            ];
            const available = data.filter(([key, , content]) =>
                (typeof content === 'string' && content.trim()) ||
                (key === 'highlights' && getHighlightImages(tabs).length)
            );
            const tabList = document.getElementById('detail-tabs');
            const panels = document.getElementById('detail-panels');
            if (!available.length) {
                document.getElementById('detail-tabs').classList.add('hidden');
                panels.textContent = '暫無詳細內容。';
                return;
            }
            tabList.innerHTML = available.map(([key, label], index) =>
                `<button type="button" class="tab-button rounded-lg border px-4 py-2 text-sm font-semibold" role="tab" id="tab-${key}" aria-controls="panel-${key}" aria-selected="${index === 0}" tabindex="${index === 0 ? 0 : -1}" data-tab="${key}">${label}</button>`
            ).join('');
            panels.replaceChildren();
            available.forEach(([key, , content], index) => {
                const panel = document.createElement('div');
                panel.id = `panel-${key}`;
                panel.setAttribute('role', 'tabpanel');
                panel.setAttribute('aria-labelledby', `tab-${key}`);
                panel.className = `${index ? 'hidden' : ''} rich-content whitespace-pre-line leading-7 text-gray-700`;
                if (key === 'highlights') {
                    const imageUrls = getHighlightImages(tabs);
                    if (imageUrls.length) {
                        const gallery = document.createElement('div');
                        gallery.className = 'mb-5 grid gap-3 sm:grid-cols-2 lg:grid-cols-3';
                        imageUrls.forEach((imageUrl, imageIndex) => {
                        const image = document.createElement('img');
                        image.src = imageUrl;
                        image.alt = `活動／品牌亮點圖片 ${imageIndex + 1}`;
                        image.loading = 'lazy';
                        image.className = 'max-h-[34rem] w-full rounded-xl object-cover';
                        gallery.append(image);
                        });
                        panel.append(gallery);
                    }
                }
                const text = document.createElement('div');
                text.className = 'rich-content';
                text.innerHTML = sanitizeRichContent(content);
                panel.append(text);
                panels.append(panel);
            });
            tabList.addEventListener('click', event => {
                const button = event.target.closest('[data-tab]');
                if (!button) return;
                tabList.querySelectorAll('[data-tab]').forEach(tab => {
                    const selected = tab === button;
                    tab.setAttribute('aria-selected', String(selected));
                    tab.tabIndex = selected ? 0 : -1;
                });
                panels.querySelectorAll('[role="tabpanel"]').forEach(panel => panel.classList.toggle('hidden', panel.id !== `panel-${button.dataset.tab}`));
            });
        }

        function getHighlightImages(tabs) {
            const urls = Array.isArray(tabs.highlightsImageUrls)
                ? tabs.highlightsImageUrls
                : [tabs.highlightsImageUrl];
            return urls.map(safeHttpsUrl).filter(Boolean).slice(0, 5);
        }

        function sanitizeRichContent(value) {
            const template = document.createElement('template');
            template.innerHTML = String(value || '');
            const allowedTags = new Set(['P', 'BR', 'H2', 'H3', 'UL', 'OL', 'LI', 'STRONG', 'B', 'EM', 'I', 'U', 'BLOCKQUOTE', 'A', 'IMG', 'SPAN', 'TABLE', 'THEAD', 'TBODY', 'TFOOT', 'TR', 'TH', 'TD']);
            const cleanNode = node => {
                if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.textContent || '');
                if (node.nodeType !== Node.ELEMENT_NODE) return document.createDocumentFragment();
                if (!allowedTags.has(node.tagName)) {
                    const fragment = document.createDocumentFragment();
                    Array.from(node.childNodes).forEach(child => fragment.append(cleanNode(child)));
                    return fragment;
                }
                const element = document.createElement(node.tagName.toLowerCase());
                if (node.tagName === 'TABLE') element.className = 'rich-table';
                if (node.tagName === 'TH' || node.tagName === 'TD') element.className = 'rich-table-cell';
                if (node.tagName === 'TH' || node.tagName === 'TD') {
                    if (['left', 'center', 'right'].includes(node.style.textAlign)) element.style.textAlign = node.style.textAlign;
                    if (['top', 'middle', 'bottom'].includes(node.style.verticalAlign)) element.style.verticalAlign = node.style.verticalAlign;
                }
                if (node.tagName === 'A') {
                    const href = safeHttpsUrl(node.getAttribute('href'));
                    if (!href) {
                        const fragment = document.createDocumentFragment();
                        Array.from(node.childNodes).forEach(child => fragment.append(cleanNode(child)));
                        return fragment;
                    }
                    element.href = href;
                    element.rel = 'noopener noreferrer';
                }
                if (node.tagName === 'IMG') {
                    const src = safeHttpsUrl(node.getAttribute('src'));
                    if (!src) return document.createDocumentFragment();
                    element.src = src;
                    element.alt = (node.getAttribute('alt') || '').slice(0, 200);
                    element.loading = 'lazy';
                    element.className = 'my-3 max-h-[32rem] max-w-full rounded-lg object-contain';
                    const imageWidth = node.style.width;
                    if (/^(?:\d{1,4}(?:\.\d+)?px|(?:100|[1-9]?\d)%)$/.test(imageWidth)) element.style.width = imageWidth;
                } else if (node.tagName === 'SPAN') {
                    const fontFamily = node.style.fontFamily;
                    const allowedFamilies = [
                        'Arial, "Noto Sans TC", sans-serif',
                        'Georgia, "Noto Serif TC", serif',
                        'KaiTi, DFKai-SB, serif',
                        '"Courier New", monospace'
                    ];
                    const fontWeight = node.style.fontWeight;
                    const fontSize = node.style.fontSize;
                    if (allowedFamilies.includes(fontFamily)) element.style.fontFamily = fontFamily;
                    if (['400', '500', '600', '700'].includes(fontWeight)) element.style.fontWeight = fontWeight;
                    if (/^(12|14|16|18|20|24|28|32|36)px$/.test(fontSize)) element.style.fontSize = fontSize;
                } else {
                    Array.from(node.childNodes).forEach(child => element.append(cleanNode(child)));
                }
                return element;
            };
            const output = document.createDocumentFragment();
            Array.from(template.content.childNodes).forEach(child => output.append(cleanNode(child)));
            return Array.from(output.childNodes).map(node => {
                const wrapper = document.createElement('div');
                wrapper.append(node.cloneNode(true));
                return wrapper.innerHTML;
            }).join('');
        }

        function renderTeam(members) {
            if (!members.length) return;
            const section = document.getElementById('team-section');
            const grid = document.getElementById('team-grid');
            grid.innerHTML = members.filter(member => member && typeof member === 'object').map(member => {
                const card = document.createElement('article');
                card.className = 'flex items-start gap-4 rounded-xl border bg-white p-4 shadow-sm sm:gap-5 sm:p-5';
                const imageUrl = safeHttpsUrl(member.imageUrl);
                if (imageUrl) {
                    const image = document.createElement('img');
                    image.src = imageUrl;
                    image.alt = '';
                    image.loading = 'lazy';
                    image.className = 'h-20 w-20 shrink-0 rounded-xl object-cover sm:h-24 sm:w-24';
                    card.append(image);
                }
                const content = document.createElement('div');
                content.className = 'min-w-0 flex-1';
                const memberType = document.createElement('p');
                memberType.className = 'mb-1 text-xs font-semibold uppercase tracking-wide text-blue-700';
                memberType.textContent = ['嘉賓', '導師', '品牌團隊'].includes(member.memberType) ? member.memberType : '嘉賓';
                const name = document.createElement('h3');
                name.className = 'font-bold text-gray-900';
                name.textContent = typeof member.name === 'string' ? member.name : '';
                const role = document.createElement('p');
                role.className = 'mt-1 text-sm font-medium text-blue-700';
                role.textContent = typeof member.role === 'string' ? member.role : '';
                const bio = document.createElement('p');
                bio.className = 'mt-3 whitespace-pre-line text-sm leading-6 text-gray-600';
                bio.textContent = typeof member.bio === 'string' ? member.bio : '';
                content.append(memberType, name, role, bio);
                card.append(content);
                return card.outerHTML;
            }).join('');
            section.classList.remove('hidden');
        }

        function renderContact(item) {
            const section = document.getElementById('contact-section');
            const methods = document.getElementById('contact-methods');
            const entries = [];
            const addEntry = (label, value, href) => {
                if (!value) return;
                const card = document.createElement('div');
                card.className = 'rounded-xl border p-4';
                const heading = document.createElement('h3');
                heading.className = 'text-sm font-semibold text-gray-500';
                heading.textContent = label;
                const content = href ? document.createElement('a') : document.createElement('p');
                content.className = 'mt-1 whitespace-pre-line font-medium text-blue-700 break-words';
                content.textContent = value;
                if (href) {
                    content.href = href;
                    content.dataset.analyticsEvent = 'contact_click';
                    if (href.startsWith('https://')) {
                        content.target = '_blank';
                        content.rel = 'noopener noreferrer';
                    }
                }
                card.append(heading, content);
                entries.push(card);
            };
            const email = String(item.contactEmail || '').trim();
            if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) addEntry('Email', email, `mailto:${email}`);
            const phone = String(item.contactPhone || '').trim();
            const phoneHref = phone.replace(/[^\d+]/g, '');
            if (/\d/.test(phoneHref)) addEntry('電話', phone, `tel:${phoneHref}`);
            const facebook = safeHttpsUrl(item.facebookUrl);
            if (facebook) addEntry('Facebook', '前往 Facebook 專頁', facebook);
            const instagram = safeHttpsUrl(item.instagramUrl);
            if (instagram) addEntry('Instagram', '前往 Instagram 專頁', instagram);
            const registrationMethod = String(item.registrationMethod || '').trim();
            if (registrationMethod) addEntry('報名方式', registrationMethod, '');
            if (!entries.length) return;
            methods.replaceChildren(...entries);
            section.classList.remove('hidden');
        }

        document.getElementById('contact-methods').addEventListener('click', event => {
            const link = event.target.closest('a[data-analytics-event="contact_click"]');
            if (link && currentFeaturedPageId) {
                void trackFeaturedActivityEvent(currentFeaturedPageId, 'contact_click');
            }
        });

        function renderCountdown(target) {
            const wrap = document.getElementById('countdown-wrap');
            const output = document.getElementById('countdown');
            const timestamp = Date.parse(String(target || '').replace(' ', 'T') + (String(target || '').includes('+') ? '' : '+08:00'));
            if (!Number.isFinite(timestamp) || timestamp <= Date.now()) return;
            wrap.classList.remove('hidden');
            const update = () => {
                const remaining = Math.max(0, timestamp - Date.now());
                const units = [
                    ['天', Math.floor(remaining / 86400000)],
                    ['小時', Math.floor(remaining / 3600000) % 24],
                    ['分鐘', Math.floor(remaining / 60000) % 60],
                    ['秒', Math.floor(remaining / 1000) % 60]
                ];
                output.innerHTML = units.map(([label, value]) => `<span><strong class="text-2xl">${value}</strong><small>${label}</small></span>`).join('');
                if (remaining === 0) wrap.classList.add('hidden');
            };
            update();
            window.setInterval(update, 1000);
        }

        function renderDetail(item) {
            const status = document.getElementById('page-status');
            const details = item.details && typeof item.details === 'object' ? item.details : {};
            const title = item.headline || item.title || '置頂內容';
            document.title = `${title}｜SpotMoCity 澳聚光`;
            const detail = document.getElementById('hero-detail');
            detail.dataset.theme = item.template === 'custom' && ['warm', 'dark', 'blue', 'green'].includes(item.customTheme) ? item.customTheme : 'light';
            detail.dataset.layout = item.template === 'custom' && item.customLayout === 'split' ? 'split' : 'classic';
            detail.dataset.order = item.template === 'custom' && ['details-first', 'people-first'].includes(item.customOrder) ? item.customOrder : 'standard';
            const layout = item.template === 'custom' ? item.smartLayout : null;
            if (layout && window.isSmartLayout(layout)) {
                detail.dataset.smartLayout = 'true';
                const container = document.createElement('div');
                container.className = 'smart-hero';
                const media = document.getElementById('hero-media');
                const header = detail.querySelector(':scope > header');
                detail.insertBefore(container, media);
                container.append(media, header);
                container.style.setProperty('--smart-display', layout.layout_style.display);
                container.style.setProperty('--smart-direction', layout.layout_style.flex_direction);
                container.style.setProperty('--smart-columns', layout.layout_style.grid_template_columns);
                container.style.gap = `${layout.layout_style.gap_px}px`;
                container.style.padding = `${layout.layout_style.padding_px}px`;
                container.style.backgroundColor = layout.layout_style.background_color;
                media.style.order = String(layout.image_box.order);
                media.style.borderStyle = layout.image_box.border_style;
                media.style.borderColor = layout.image_box.border_color;
                media.style.borderWidth = `${layout.image_box.border_width_px}px`;
                media.style.borderRadius = `${layout.image_box.border_radius_px}px`;
                media.style.boxShadow = layout.image_box.box_shadow;
                header.style.order = String(layout.text_box.order);
                header.style.textAlign = layout.text_box.text_align;
                header.style.color = readableTextColor(layout.text_box.color, layout.layout_style.background_color);
                header.style.fontFamily = layout.text_box.font_family;
                header.style.backgroundColor = layout.layout_style.background_color;
                if (layout.page_style) {
                    detail.dataset.smartPage = 'true';
                    detail.style.gap = `${layout.page_style.section_gap_px}px`;
                    const palettes = {
                        light: ['#ffffff', '#1f2937', '#cbd5e1', '#1d4ed8'],
                        warm: ['#fffbeb', '#713f12', '#d6b77a', '#92400e'],
                        dark: ['#172033', '#f8fafc', '#64748b', '#93c5fd'],
                        blue: ['#eff6ff', '#1e3a5f', '#93b4dc', '#1d4ed8'],
                        green: ['#ecfdf5', '#14532d', '#86c9a0', '#166534']
                    };
                    const styles = {
                        rounded: ['1rem', '0 1px 5px #0f172a18'],
                        outlined: ['0.5rem', 'none'],
                        flat: ['0', 'none']
                    };
                    const sectionIds = { highlights: 'highlight-grid', details: 'details-section', team: 'team-section', contact: 'contact-section' };
                    layout.page_style.section_order.forEach((name, index) => {
                        const section = document.getElementById(sectionIds[name]);
                        const options = layout.page_style.sections[name];
                        const [background, text, border, link] = palettes[options.palette];
                        const [radius, shadow] = styles[options.style];
                        section.dataset.smartSection = name;
                        section.style.order = String(index + 1);
                        detail.append(section);
                        section.style.setProperty('--section-bg', background);
                        section.style.setProperty('--section-text', text);
                        section.style.setProperty('--section-border', border);
                        section.style.setProperty('--section-link', link);
                        section.style.setProperty('--section-radius', radius);
                        section.style.setProperty('--section-shadow', shadow);
                        section.style.setProperty('--section-columns', String(options.columns));
                    });
                }
            } else if (layout) {
                console.error('Invalid smart layout; using the standard featured layout.');
            }
            const backgroundUrl = safeHttpsUrl(item.pageBackgroundUrl);
            if (backgroundUrl) {
                const scale = Math.min(160, Math.max(100, Number(item.pageBackgroundScale) || 100));
                const position = Math.min(100, Math.max(0, Number(item.pageBackgroundPosition ?? 50)));
                document.body.style.backgroundImage = `linear-gradient(rgb(248 250 252 / 78%), rgb(248 250 252 / 78%)), url("${backgroundUrl}")`;
                document.body.style.backgroundSize = `cover, ${scale}% auto`;
                document.body.style.backgroundPosition = `center, center ${position}%`;
                document.body.style.backgroundAttachment = 'fixed';
            }
            document.getElementById('hero-title').textContent = title;
            document.getElementById('hero-subtitle').textContent = item.subtitle || item.description || '';
            document.getElementById('hero-kicker').textContent = item.template === 'custom' ? 'SpotMoCity 精選' : '活動／品牌介紹';
            renderHeroMedia(item);
            renderHighlights(details.highlights || {});
            renderTabs(details.tabs || {});
            renderTeam(Array.isArray(details.members) ? details.members : []);
            renderContact(item);
            heroDetail.querySelectorAll('img').forEach(image => {
                image.tabIndex = 0;
                image.setAttribute('role', 'button');
                image.setAttribute('aria-label', `放大圖片：${image.alt || '置頂內容圖片'}`);
            });
            if (item.countdownEnabled) renderCountdown(item.countdownTarget);
            const ctaUrl = safeHttpsUrl(item.ctaUrl);
            if (ctaUrl && item.ctaLabel) {
                const cta = document.getElementById('hero-cta');
                cta.href = ctaUrl;
                cta.textContent = item.ctaLabel;
                cta.target = '_blank';
                cta.rel = 'noopener noreferrer';
                cta.classList.remove('hidden');
            }
            detail.classList.remove('hidden');
            status.classList.add('hidden');
        }

        async function loadDetail(trackView = true) {
            const requestedId = new URLSearchParams(location.search).get('id');
            const status = document.getElementById('page-status');
            if (!requestedId) {
                status.textContent = '未指定置頂內容。';
                return;
            }
            const { data, error } = await supabaseClient.from('site_settings').select('value').eq('key', 'home_hero_items').maybeSingle();
            if (error) {
                status.textContent = '內容載入失敗，請稍後再試。';
                console.error('Featured detail load failed:', error.message);
                return;
            }
            const item = parseArray(data?.value).find((entry, index) =>
                String(entry.pageId || `hero-${entry.order || index + 1}`) === requestedId
            );
            if (!item) {
                status.textContent = '找不到此置頂內容，可能已下架。';
                return;
            }
            currentFeaturedPageId = requestedId;
            renderDetail(item);
            if (trackView) void trackFeaturedActivityEvent(requestedId, 'detail_view');
        }

        const siteSettingsChannel = 'BroadcastChannel' in window ? new BroadcastChannel('spotmocity-site-settings') : null;
        if (!isPreview) {
            siteSettingsChannel?.addEventListener('message', event => {
                if (event.data?.key === 'home_hero_items') void loadDetail(false);
            });
        }

        if (isPreview) {
            let previewRendered = false;
            window.addEventListener('message', event => {
                const trustedOrigin = event.origin === location.origin || (location.protocol === 'file:' && event.origin === 'null');
                if (previewRendered || event.source !== window.parent || !trustedOrigin || event.data?.type !== 'featured-design-preview' || !event.data.item || typeof event.data.item !== 'object') return;
                previewRendered = true;
                renderDetail(event.data.item);
            });
        } else {
            loadDetail();
        }
    </script>
